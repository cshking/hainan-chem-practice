<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>海南高考真题精练 · 一平台两用</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --chem: #0ea5e9;
      --chem-dark: #0369a1;
      --hist: #d97706;
      --hist-dark: #b45309;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh;
    }
    .home { max-width: 860px; margin: 0 auto; padding: 40px 18px 60px; }
    header { text-align: center; margin-bottom: 32px; }
    .title { font-size: 30px; font-weight: 800; margin: 0 0 8px; letter-spacing: 1px; }
    .sub { font-size: 15px; color: var(--muted); margin: 0; }
    .channels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 620px) { .channels { grid-template-columns: 1fr; } }
    .ch {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 26px 22px; box-shadow: var(--shadow);
      transition: transform .15s, box-shadow .15s, border-color .15s;
      position: relative; overflow: hidden;
    }
    .ch::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    }
    .ch-chem::before { background: var(--chem); }
    .ch-hist::before { background: var(--hist); }
    .ch:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.10); }
    .ch-chem:hover { border-color: var(--chem); }
    .ch-hist:hover { border-color: var(--hist); }
    .ico { font-size: 40px; margin-bottom: 10px; }
    .ch h2 { font-size: 22px; margin: 0 0 8px; }
    .ch p { font-size: 14px; color: var(--muted); margin: 0 0 14px; }
    .go { display: inline-block; font-weight: 700; font-size: 14px; padding: 6px 0; }
    .ch-chem .go { color: var(--chem-dark); }
    .ch-hist .go { color: var(--hist-dark); }
    .note {
      margin-top: 30px; text-align: center; font-size: 12.5px; color: var(--muted);
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 10px 14px; line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="home">
    <header>
      <h1 class="title">海南高考真题精练</h1>
      <p class="sub">一平台两用 · 化学练习 / 历史练习 · 每题拆解到纳米知识点，学懂弄通</p>
    </header>

    <div class="channels">
      <a class="ch ch-chem" href="chem/index.html">
        <div class="ico">🧪</div>
        <h2>化学练习</h2>
        <p>新高考 · 选择性考试 · 单选 / 不定项 / 填空转化题<br>做错必重述知识点，整套重做直到全对</p>
        <span class="go">进入化学练习 →</span>
      </a>
      <a class="ch ch-hist" href="history/index.html">
        <div class="ico">📜</div>
        <h2>历史练习</h2>
        <p>新高考 · 历史 · 选择题 / 非选择题（多选）<br>做错必重述知识点，整套重做直到全对</p>
        <span class="go">进入历史练习 →</span>
      </a>
    </div>

    <p class="note">
      ⚠️ <b>数据说明：</b>化学、历史两套练习均汇总自你提供的网络下载练习资料，<strong>均非官方真题</strong>，个别题/答案可能有瑕疵，请以教材和官方发布为准。<br>
      进度自动保存在本机浏览器，关掉页面再打开可接着练（仅本设备有效）。
    </p>
  </div>
</body>
</html>
